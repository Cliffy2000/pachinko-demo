<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pachinko</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cabinet">
    <canvas id="field" width="640" height="875"></canvas>

    <section class="panel">
      <div class="readout">
        <div class="stat"><span class="label">Box</span><span id="stat-box">0</span></div>
        <div class="stat"><span class="label">In play</span><span id="stat-live">0</span></div>
        <div class="stat"><span class="label">Drained</span><span id="stat-drained">0</span></div>
        <div class="stat"><span class="label">Spilled</span><span id="stat-spilled">0</span></div>
        <div class="stat"><span class="label">Lucky slot</span><span id="stat-lucky">0</span></div>
        <div class="stat"><span class="label">Bonus</span><span id="stat-bonus">-</span></div>
        <div class="stat"><span class="label">Cash</span><span id="stat-cash">0</span></div>
      </div>

      <label class="knob">
        <span class="label">Launch power</span>
        <input id="power" type="range" min="0" max="100" value="75">
      </label>

      <div class="buy">
        <button type="button" data-buy="10">Buy 10</button>
        <button type="button" data-buy="50">Buy 50</button>
      </div>
      <button id="auto-fire" type="button" aria-pressed="false">Auto fire: off</button>
      <button id="launch-from" type="button">Launch from: box</button>
      <p class="hint">Drag the lever down and let go, or turn on auto fire at the slider's power.</p>

      <button id="bonus-fire" type="button" hidden>FIRE</button>

      <p class="brand"><span class="brand-hide-cursor">PA</span>CHINKO</p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
