<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pachinko</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cabinet">
    <canvas id="field" width="640" height="875"></canvas>

    <section class="panel">
      <div class="readout">
        <div class="stat"><span class="label">Tray</span><span id="stat-tray">0</span></div>
        <div class="stat"><span class="label">Storage</span><span id="stat-store">0</span></div>
        <div class="stat"><span class="label">In play</span><span id="stat-live">0</span></div>
        <div class="stat"><span class="label">Drained</span><span id="stat-drained">0</span></div>
        <div class="stat"><span class="label">Spilled</span><span id="stat-spilled">0</span></div>
      </div>

      <label class="knob">
        <span class="label">Launch power</span>
        <input id="power" type="range" min="0" max="100" value="75">
      </label>

      <button id="add-balls" type="button">Fill tray</button>
      <button id="payout" type="button">Payout 50</button>
      <p class="hint">Drag the lever down and let go.</p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
